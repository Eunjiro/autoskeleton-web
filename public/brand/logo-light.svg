    <rect width="128" height="128" rx="22" fill="#F4F4F5"/>
    <rect x="1" y="1" width="126" height="126" rx="21" stroke="#E4E4E7" stroke-width="6.4"/>
    <circle cx="34" cy="34" r="14" fill="#6366F1"/>
    <rect x="56" y="26" width="52" height="10" rx="5" fill="#D4D4D8"/>
    <rect x="56" y="42" width="36" height="10" rx="5" fill="#E4E4E7"/>
    <rect x="20" y="66" width="88" height="10" rx="5" fill="#D4D4D8"/>
    <rect x="20" y="82" width="72" height="10" rx="5" fill="#E4E4E7"/>
    <rect x="20" y="98" width="54" height="10" rx="5" fill="#D4D4D8"/>
  </g>
  <!-- Wordmark — for use on light backgrounds -->
